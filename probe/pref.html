<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, sans-serif; padding: 8px 16px; }
  label { display: block; margin: 10px 0 2px; }
  input { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; }
  p { color: #888; }
</style>
</head>
<body>
  <p>Scrobbler Probe: Last.fm API credentials used only by the "Probe: Last.fm …" menu items.</p>
  <label for="api_key">API key</label>
  <input id="api_key" type="text" data-pref-key="api_key">
  <label for="api_secret">Shared secret</label>
  <input id="api_secret" type="password" data-pref-key="api_secret">
</body>
</html>
