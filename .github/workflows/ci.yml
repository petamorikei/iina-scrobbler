name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Lint, type-check, test
        run: mise run check
      - name: Build without Last.fm credentials
        run: mise run build:nosecrets
